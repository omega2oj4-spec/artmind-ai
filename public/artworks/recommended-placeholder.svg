<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#E0F6FF"/>
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#90EE90"/>
      <stop offset="100%" style="stop-color:#228B22"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="400" height="200" fill="url(#sky)"/>
  <!-- Sun -->
  <circle cx="320" cy="60" r="40" fill="#FFD700" opacity="0.9"/>
  <!-- Mountains -->
  <path d="M0,200 L100,120 L200,200 L300,100 L400,200 L400,300 L0,300 Z" fill="#6B8E23"/>
  <!-- Ground -->
  <rect y="200" width="400" height="100" fill="url(#ground)"/>
  <!-- Trees -->
  <path d="M50,200 L70,140 L90,200 Z" fill="#228B22"/>
  <rect x="65" y="200" width="10" height="30" fill="#8B4513"/>
  <path d="M320,200 L340,150 L360,200 Z" fill="#228B22"/>
  <rect x="335" y="200" width="10" height="30" fill="#8B4513"/>
  <!-- Village houses -->
  <rect x="120" y="160" width="40" height="40" fill="#DEB887"/>
  <path d="M120,160 L140,140 L160,160 Z" fill="#8B4513"/>
  <rect x="130" y="175" width="10" height="15" fill="#4169E1"/>
  <rect x="250" y="155" width="50" height="45" fill="#DEB887"/>
  <path d="M250,155 L275,130 L300,155 Z" fill="#8B4513"/>
  <rect x="265" y="170" width="12" height="18" fill="#4169E1"/>
</svg>